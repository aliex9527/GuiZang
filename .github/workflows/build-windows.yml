name: Build Windows EXE

on:
  workflow_dispatch:          # 手动触发
  push:
    tags:
      - 'v*'                   # 打 tag 时自动触发

permissions:
  contents: write              # 允许 softprops/action-gh-release 创建/更新 Release
  issues: write                # 构建失败时把日志贴成 issue，便于排查

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0          # 生成版本说明要读完整 git 历史

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Resolve version
        id: ver
        shell: bash
        run: |
          # 唯一来源是仓库根的 VERSION；打 tag 时以 tag 为准
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V="$(tr -d '[:space:]' < VERSION)"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "本次构建版本：$V"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # 锁死 Qt/PyInstaller 版本：CI 上装了新版本后 Windows 打包会莫名失败，
          # 与本地验证过的组合对齐才好复现
          pip install "PySide6-Essentials==6.12.0" markdown html2text Pygments "pyinstaller==6.22.3"

      - name: Build EXE
        shell: bash          # Windows runner 默认用 PowerShell，set/tee 这套写法必须走 bash
        env:
          GZ_VERSION: ${{ steps.ver.outputs.version }}
          PYTHONUTF8: '1'          # Windows runner 上 Python 默认 cp1252，中文输出会崩
        run: |
          set -o pipefail
          pyinstaller GuiZang.spec --noconfirm --distpath dist --workpath build 2>&1 | tee build.log

      - name: Rename with version
        shell: bash
        run: |
          V="${{ steps.ver.outputs.version }}"
          mv dist/GuiZang.exe "dist/GuiZang-${V}-windows-x64.exe"
          ls -lh dist/

      - name: Prepare release notes
        shell: bash
        run: |
          V="${{ steps.ver.outputs.version }}"
          NOTE="docs/releases/v${V}.md"
          if [ -f "$NOTE" ]; then
            # 仓库里已有手写说明：只回填这次构建的大小 / SHA256 / 提交号，正文保留
            python tools/release_note.py --version "$V" --refresh \
              --exe "dist/GuiZang-${V}-windows-x64.exe"
          else
            python tools/release_note.py --version "$V" \
              --exe "dist/GuiZang-${V}-windows-x64.exe"
          fi
          # 用 ASCII 文件名上传，否则 Release 里会显示成 default.md
          cp "dist/版本说明.md" "dist/GuiZang-${V}-windows-x64.md"
          ls -l dist/*.md

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: GuiZang-${{ steps.ver.outputs.version }}-windows-x64
          path: |
            dist/*.exe
            dist/*.md
          if-no-files-found: error

      - name: Publish to Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: docs/releases/v${{ steps.ver.outputs.version }}.md
          files: |
            dist/*.exe
            dist/*.md
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish build log on failure
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          # runner 上的日志我们本地看不到，失败时贴到 issue 里才能查
          { echo "ref: ${GITHUB_REF_NAME}"; echo "runner: ${RUNNER_OS}"; echo;             tail -n 200 build.log 2>/dev/null || echo "(no build.log)"; } > log_tail.txt
          gh issue create --title "[CI] Windows 构建失败 ${GITHUB_REF_NAME}" \
            --body-file log_tail.txt || true
