name: Build Linux

on:
  workflow_dispatch:          # 手动触发
  push:
    tags:
      - 'v*'                   # 打 tag 时自动触发

permissions:
  contents: write              # softprops/action-gh-release 需要写权限

jobs:
  build-linux:
    runs-on: ubuntu-22.04      # 22.04 的 glibc 2.35，兼容大多数主流发行版
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install Qt runtime libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 \
            libxcb-xinerama0 libxcb-randr0 libdbus-1-3 libfontconfig1 \
            libxrender1 libxi6 libxtst6

      - name: Resolve version
        id: ver
        run: |
          # 唯一来源是仓库根的 VERSION；打 tag 时以 tag 为准
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V="$(tr -d '[:space:]' < VERSION)"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "本次构建版本：$V"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # 锁死 Qt/PyInstaller 版本：CI 上装了新版本后 Windows 打包会莫名失败，
          # 与本地验证过的组合对齐才好复现
          pip install "PySide6-Essentials==6.12.0" markdown html2text Pygments "pyinstaller==6.22.3"

      - name: Build (onedir)
        env:
          GZ_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          pyinstaller GuiZang_linux.spec --noconfirm --distpath dist --workpath build
          chmod +x dist/GuiZang/GuiZang
          ls -lh dist/GuiZang | head -20

      - name: Add readme and package tar.gz
        env:
          V: ${{ steps.ver.outputs.version }}
        run: |
          sed -e "s/@VERSION@/${V}/g" tools/linux_readme.txt > "dist/GuiZang/使用说明.txt"
          tar -czf "dist/GuiZang-${V}-linux-x64.tar.gz" -C dist GuiZang
          ls -lh dist/*.tar.gz

      - name: Upload tarball
        uses: actions/upload-artifact@v4
        with:
          name: GuiZang-${{ steps.ver.outputs.version }}-linux-x64
          path: dist/*.tar.gz
          if-no-files-found: error

      - name: Publish to Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
