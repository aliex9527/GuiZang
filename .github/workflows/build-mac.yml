name: Build macOS DMG

on:
  workflow_dispatch:          # 手动触发
  push:
    tags:
      - 'v*'                   # 打 tag 时自动触发

jobs:
  build-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-13（Intel）已于 2025-12-04 退役：用它的作业不会报错，
          # 只会一直排队到 24 小时后被自动取消。macos-15-intel 是目前
          # GitHub 托管的 x86_64 macOS 镜像（可用到约 2027-08）。
          - os: macos-15-intel   # Intel (x86_64)
            arch: x64
          - os: macos-14        # Apple Silicon (arm64)
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Resolve version
        id: ver
        run: |
          # tag 触发时用 tag 名（v1.0.3 → 1.0.3），手动触发时沿用默认值
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            V="${GITHUB_REF_NAME#v}"
          else
            V="1.0.3"
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "本次构建版本：$V"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PySide6-Essentials markdown html2text Pygments pyinstaller

      - name: Build .app
        env:
          GZ_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          pyinstaller GuiZang_mac.spec --noconfirm --distpath dist --workpath build

      - name: Create DMG
        env:
          GZ_VERSION: ${{ steps.ver.outputs.version }}
        run: |
          APP_NAME="GuiZang"
          VERSION="${GZ_VERSION}"
          ARCH="${{ matrix.arch }}"
          DMG_TMP="dist/dmg_tmp"
          rm -rf "$DMG_TMP"
          mkdir -p "$DMG_TMP"
          cp -R "dist/${APP_NAME}.app" "$DMG_TMP/"
          ln -s /Applications "$DMG_TMP/Applications"
          OUT="dist/${APP_NAME}-${VERSION}-${ARCH}.dmg"
          rm -f "$OUT"
          # macos-15-intel 镜像上 hdiutil 偶发 "Resource busy"（多为 Spotlight/
          # 磁盘映像守护进程占用），重试即可成功
          ok=0
          for i in 1 2 3 4 5; do
            echo "hdiutil create attempt $i"
            if hdiutil create -volname "${APP_NAME}" \
                 -srcfolder "$DMG_TMP" \
                 -ov -format UDZO \
                 "$OUT"; then
              ok=1
              break
            fi
            sleep $((i * 5))
          done
          [ "$ok" = 1 ] || { echo "hdiutil create failed after 5 attempts"; exit 1; }
          rm -rf "$DMG_TMP"

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: GuiZang-${{ matrix.arch }}-dmg
          path: dist/*.dmg
          if-no-files-found: error
