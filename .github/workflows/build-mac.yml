name: Build macOS DMG

on:
  workflow_dispatch:          # 手动触发
  push:
    tags:
      - 'v*'                   # 打 tag 时自动触发

jobs:
  build-macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-13        # Intel (x86_64)
            arch: x64
          - os: macos-14        # Apple Silicon (arm64)
            arch: arm64
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PySide6-Essentials markdown html2text Pygments pyinstaller

      - name: Generate icon (icns)
        run: |
          python tools/make_icon.py

      - name: Build .app
        run: |
          pyinstaller GuiZang_mac.spec --noconfirm --distpath dist --workpath build

      - name: Create DMG
        run: |
          APP_NAME="GuiZang"
          VERSION="1.0.0"
          ARCH="${{ matrix.arch }}"
          DMG_TMP="dist/dmg_tmp"
          rm -rf "$DMG_TMP"
          mkdir -p "$DMG_TMP"
          cp -R "dist/${APP_NAME}.app" "$DMG_TMP/"
          ln -s /Applications "$DMG_TMP/Applications"
          hdiutil create -volname "${APP_NAME}" \
            -srcfolder "$DMG_TMP" \
            -ov -format UDZO \
            "dist/${APP_NAME}-${VERSION}-${ARCH}.dmg"
          rm -rf "$DMG_TMP"

      - name: Upload DMG
        uses: actions/upload-artifact@v4
        with:
          name: GuiZang-${{ matrix.arch }}-dmg
          path: dist/*.dmg
          if-no-files-found: error
