[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mdengine"
version = "1.1.0"
description = "零依赖的 Markdown 引擎：Markdown→HTML、HTML→Markdown、内置代码高亮"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
keywords = ["markdown", "parser", "renderer", "html2text", "highlight"]
dependencies = []

[project.scripts]
mdengine = "mdengine.cli:main"

[tool.setuptools]
# 这个 pyproject.toml 就在包目录里（mdengine/__init__.py 与本文件同级），
# 所以把包名映射到当前目录，而不是默认去找 mdengine/mdengine/。
packages = ["mdengine"]

[tool.setuptools.package-dir]
mdengine = "."

[tool.setuptools.package-data]
mdengine = ["README.md"]
